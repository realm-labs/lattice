[package]
name = "lattice-service"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["rustls-ring"]
tls = ["lattice-remoting/tls"]
rustls-ring = ["tls", "lattice-remoting/rustls-ring"]
rustls-aws-lc = ["tls", "lattice-remoting/rustls-aws-lc"]

[dependencies]
arc-swap.workspace = true
async-trait.workspace = true
bytes.workspace = true
dashmap.workspace = true
futures-util.workspace = true
lattice-actor.workspace = true
lattice-actor-distributed.workspace = true
lattice-model.workspace = true
lattice-discovery.workspace = true
lattice-coordination.workspace = true
lattice-remoting.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
rcgen.workspace = true
tokio-rustls.workspace = true
lattice-coordination = { workspace = true, features = ["test-harness"] }
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "test-util"] }
lattice-failpoint = { workspace = true, features = ["enabled"] }
prost.workspace = true
serde.workspace = true
trybuild.workspace = true
