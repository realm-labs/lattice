[package]
name = "lattice-sim"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
async-trait.workspace = true
bytes.workspace = true
clap.workspace = true
futures-util.workspace = true
lattice-failpoint = { workspace = true, features = ["enabled"] }
lattice-model.workspace = true
lattice-actor.workspace = true
lattice-actor-distributed.workspace = true
lattice-config.workspace = true
lattice-config-etcd.workspace = true
lattice-discovery.workspace = true
lattice-discovery-k8s.workspace = true
lattice-coordination = { workspace = true, features = ["test-harness"] }
lattice-remoting.workspace = true
lattice-service.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
trybuild.workspace = true

[[bin]]
name = "testctl"
path = "src/bin/testctl.rs"

[[bin]]
name = "distributed-node"
path = "src/bin/distributed_node.rs"

[[bin]]
name = "k8s-probe"
path = "src/bin/k8s_probe.rs"
